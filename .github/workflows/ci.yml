name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Start MySQL
        env:
          MYSQL_IMAGE: docker.m.daocloud.io/library/mysql:8.0
        run: |
          cp .env.example .env
          docker compose up -d --wait mysql
      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: smartvoyage123
          DB_NAME: travel_rag
          JWT_SECRET: ci-test-secret
          LLM_API_KEY: ""
        run: python -m pytest -q
      - name: Build Docker image with layer cache
        uses: docker/setup-buildx-action@v3
      - name: Build and cache image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smartvoyage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE_NODE=docker.m.daocloud.io/library/node:20-alpine
            BASE_IMAGE_PYTHON=docker.m.daocloud.io/library/python:3.11-slim
            PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
            NPM_REGISTRY=https://registry.npmmirror.com

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Use domestic npm registry
        working-directory: web
        run: npm config set registry https://registry.npmmirror.com
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
