services:
  # ---------- 数据库 ----------
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: smartvoyage-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-smartvoyage123}
      MYSQL_DATABASE: ${DB_NAME:-travel_rag}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/01_create.sql
      - ./sql/hotel_table.sql:/docker-entrypoint-initdb.d/02_hotel.sql
      - ./sql/v2_tables.sql:/docker-entrypoint-initdb.d/03_v2_tables.sql
      - ./sql/insert_data.sql:/docker-entrypoint-initdb.d/04_insert.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- MCP 服务 ----------
  mcp-ticket:
    build: .
    container_name: smartvoyage-mcp-ticket
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    command: python mcp_servers/mcp_ticket_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  mcp-weather:
    build: .
    container_name: smartvoyage-mcp-weather
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    command: python mcp_servers/mcp_weather_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8002), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  mcp-order:
    build: .
    container_name: smartvoyage-mcp-order
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    command: python mcp_servers/mcp_order_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8003), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  mcp-hotel:
    build: .
    container_name: smartvoyage-mcp-hotel
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    command: python mcp_servers/mcp_hotel_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8004), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- A2A 服务 ----------
  a2a-weather:
    build: .
    container_name: smartvoyage-a2a-weather
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      MCP_WEATHER_URL: http://mcp-weather:8002/mcp
    command: python agents/weather_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/agent.json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mcp-weather:
        condition: service_healthy

  a2a-ticket:
    build: .
    container_name: smartvoyage-a2a-ticket
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      MCP_TICKET_URL: http://mcp-ticket:8001/mcp
    command: python agents/ticket_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5006/agent.json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mcp-ticket:
        condition: service_healthy

  a2a-order:
    build: .
    container_name: smartvoyage-a2a-order
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      MCP_ORDER_URL: http://mcp-order:8003/mcp
      A2A_TICKET_URL: http://a2a-ticket:5006
    command: python agents/order_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5007/agent.json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      a2a-ticket:
        condition: service_healthy
      mcp-order:
        condition: service_healthy

  a2a-hotel:
    build: .
    container_name: smartvoyage-a2a-hotel
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      MCP_HOTEL_URL: http://mcp-hotel:8004/mcp
    command: python agents/hotel_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5008/agent.json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mcp-hotel:
        condition: service_healthy

  a2a-itinerary:
    build: .
    container_name: smartvoyage-a2a-itinerary
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      A2A_WEATHER_URL: http://a2a-weather:5005
      A2A_TICKET_URL: http://a2a-ticket:5006
      A2A_HOTEL_URL: http://a2a-hotel:5008
    command: python agents/itinerary_server.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5009/agent.json', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      a2a-weather:
        condition: service_healthy
      a2a-ticket:
        condition: service_healthy
      a2a-hotel:
        condition: service_healthy

  # ---------- API 服务 ----------
  api-server:
    build: .
    container_name: smartvoyage-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      A2A_WEATHER_URL: http://a2a-weather:5005
      A2A_TICKET_URL: http://a2a-ticket:5006
      A2A_ORDER_URL: http://a2a-order:5007
      A2A_HOTEL_URL: http://a2a-hotel:5008
      A2A_ITINERARY_URL: http://a2a-itinerary:5009
    command: python backend/api_server.py
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      a2a-weather:
        condition: service_healthy
      a2a-ticket:
        condition: service_healthy
      a2a-order:
        condition: service_healthy
      a2a-hotel:
        condition: service_healthy
      a2a-itinerary:
        condition: service_healthy

  # ---------- 前端 ----------
  frontend:
    image: ${NODE_IMAGE:-node:20-alpine}
    container_name: smartvoyage-frontend
    restart: unless-stopped
    working_dir: /app/web
    volumes:
      - ./web:/app/web
    environment:
      VITE_API_PROXY: http://api-server:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173", ">", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api-server:
        condition: service_healthy

volumes:
  mysql_data:
